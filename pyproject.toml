[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "textsnap"
version = "0.4.0"
description = "Snap any image, screenshot, or webpage into plaintext. PP-OCRv6 on CPU, PaddleOCR-VL when it matters. No GPU. No cloud."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kouhxp", email = "hi@kouh.me" }]
keywords = ["ocr", "paddleocr", "pp-ocrv6", "onnx", "cpu", "vlm", "document-parsing", "screenshot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing",
]
dependencies = [
    "numpy>=1.21",
    "pillow>=10.0",
    "onnxruntime>=1.17",
    "huggingface_hub>=0.20",
    "requests>=2.31",
    "tokenizers>=0.15",
    "psutil>=5.9",
    "beautifulsoup4>=4.11",
    "readability-lxml>=0.8.1",
    "lxml>=4.9",
    "opencv-python-headless>=4.8",
    "wordfreq>=3.0",
]

[project.urls]
Homepage = "https://github.com/kouhxp/textsnap"
Repository = "https://github.com/kouhxp/textsnap"
Issues = "https://github.com/kouhxp/textsnap/issues"

[project.scripts]
textsnap = "textsnap:main"
ocr = "textsnap:main"

[tool.setuptools]
py-modules = ["textsnap"]
